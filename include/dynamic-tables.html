<!-- =============================================================================
DYNAMIC CSV TABLE HYDRATOR ASSETS (Client-side JS & CSS Bundle)
============================================================================= -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-datatables@latest/dist/style.css">
<style>
  table.dynamic-table-target th { vertical-align: top !important; }
  table.dynamic-table-target td,
  table.dynamic-table-target th,
  table.dynamic-table-target td *,
  table.dynamic-table-target th *,
  table.dynamic-table-target .math,
  table.dynamic-table-target mjx-container,
  table.dynamic-table-target .katex {
    white-space: nowrap !important;
  }
  .dynamic-table-ctrl-wrap { display: block; margin-top: 4px; }
  .dynamic-table-ctrl-select {
    display: block; width: 100%; max-width: 120px; font-size: 0.8em;
    padding: 2px 4px; border-radius: 4px; border: 1px solid #ced4da; background: #fff; cursor: pointer;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest/dist/umd/simple-datatables.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("table.dynamic-table-target").forEach((table) => {
      let customColumns = [];
      if (table.dataset.columns) {
        try { customColumns = JSON.parse(table.dataset.columns); } catch (e) {}
      }

      const globalSortable = table.dataset.sortable !== "false";

      // 1. Build Simple-DataTables column configurations using native render callbacks
      const columnRules = customColumns.map(col => {
        col.scaleFactor = 1.0;
        col.activeFormatter = FORMATTERS[col.formatter] || FORMATTERS[col.type] || FORMATTERS.default;

        const rule = { select: col.index };
        if (col.sortable !== undefined) rule.sortable = col.sortable;
        else if (!globalSortable) rule.sortable = false;

        if (col.type === "string") {
          rule.type = "string";
        } else if (col.type === "number") {
          rule.type = "number";
        }

        // Native Simple-DataTables render callback: handles units scaling & formatting
        if (col.formatter || col.units || col.type === "number") {
          rule.render = (data, td, rowIndex, cellIndex) => {
            if (data === null || data === undefined || String(data).trim() === "") return "";
            const num = parseFloat(data);
            if (isNaN(num)) return data;
            const scaledVal = num * (col.scaleFactor || 1.0);
            
            // Return actual DOM nodes if the formatter provided them, otherwise return text
            const formatted = col.activeFormatter(scaledVal);
            if (formatted instanceof Node) {
                // Clear the cell and append the node to bypass HTML string escaping
                td.innerHTML = "";
                td.appendChild(formatted);
                return td; // Returning the modified td signals simple-datatables to use it
            }
            return formatted;
          };
        }

        return rule;
      });

      // 2. Initialize Simple-DataTables
      const dt = new simpleDatatables.DataTable(table, {
        searchable: table.dataset.searchable !== "false",
        sortable: true,
        perPage: parseInt(table.dataset.perPage || "15", 10),
        ignorePunctuation: false,
        columns: columnRules.length > 0 ? columnRules : undefined,
        labels: { placeholder: "Search table...", perPage: "entries per page", noRows: "No entries found", info: "Showing {start} to {end} of {rows} entries" }
      });

      // 3. Mount UI controls (dropdown filters, unit selectors) post-init
      dt.on("datatable.init", () => {
        customColumns.forEach(col => {
          Object.values(UI_MODULES).forEach(module => {
            if (module.isApplicable(col)) {
              module.init(table, col, dt);
            }
          });
        });

        const triggerMathTypeset = () => {
          if (window.Quarto && typeof window.Quarto.typesetMath === "function") {
            // ONLY typeset the header to prevent DOM mutation in the table body
            const thead = table.querySelector("thead");
            if (thead) window.Quarto.typesetMath(thead);
          }
        };

        triggerMathTypeset();
        dt.on("datatable.page", triggerMathTypeset);
        dt.on("datatable.sort", triggerMathTypeset);
        dt.on("datatable.perpage", triggerMathTypeset);
      });
    });
  });

  // ===========================================================================
  // EXTENSIBLE CELL FORMATTERS REGISTRY
  // ===========================================================================
  const FORMATTERS = {
    default: (val) => {
      const abs = Math.abs(val);
      return (abs > 0 && (abs < 1e-3 || abs >= 1e4)) ? val.toExponential(2) : Number(val.toFixed(4)).toString();
    },

    // TeX atomic group {...} formatting using pure DOM Nodes to bypass string escaping
    latexnum: (val) => {
      if (val === 0) return '0';
      const abs = Math.abs(val);
      if (abs >= 1e-3 && abs < 1e4) {
        return Number(val.toFixed(4)).toString();
      }
      
      const parts = val.toExponential(2).split("e");
      
      // Construct: 1.39 × 10^5 as DOM elements
      const frag = document.createDocumentFragment();
      
      const mantissa = document.createTextNode(parts[0] + " \u00D7 10"); // \u00D7 is the multiplication sign (×)
      frag.appendChild(mantissa);
      
      const sup = document.createElement("sup");
      sup.textContent = parseInt(parts[1], 10).toString();
      frag.appendChild(sup);
      
      return frag;
    }
  };

  // ===========================================================================
  // EXTENSIBLE UI FEATURE MODULES REGISTRY
  // ===========================================================================
  const UI_MODULES = {
    // Category Dropdown Filter
    dropdown: {
      isApplicable: (col) => col.dropdown === true,
      init: (table, col, dt) => {
        const th = table.querySelectorAll("thead th")[col.index];
        if (!th) return;

        const uniqueVals = new Set();
        // Read from dt.data instead of the DOM to ensure we capture paginated rows
        dt.data.data.forEach(row => {
          const cellData = row[col.index].text || row[col.index].data || "";
          if (cellData.trim() !== "") uniqueVals.add(cellData.trim());
        });

        const wrap = document.createElement("div");
        wrap.className = "dynamic-table-ctrl-wrap";
        const select = document.createElement("select");
        select.className = "dynamic-table-ctrl-select";
        select.innerHTML = '<option value="">All</option>' + Array.from(uniqueVals).sort().map(v => `<option value="${v}">${v}</option>`).join("");

        const applyFilter = () => {
          const filterVal = select.value.trim();
          dt.search(filterVal);
        };

        wrap.addEventListener("click", e => e.stopPropagation());
        select.addEventListener("click", e => e.stopPropagation());
        select.addEventListener("change", applyFilter);
        wrap.appendChild(select);
        th.appendChild(wrap);
      }
    },

    // Dynamic Unit Converter
    units: {
      isApplicable: (col) => col.units && col.map,
      init: (table, col, dt) => {
        const th = table.querySelectorAll("thead th")[col.index];
        if (!th) return;

        col.scaleFactor = col.map[col.units[0]] !== undefined ? col.map[col.units[0]] : 1.0;

        const wrap = document.createElement("div");
        wrap.className = "dynamic-table-ctrl-wrap";
        const select = document.createElement("select");
        select.className = "dynamic-table-ctrl-select";
        select.innerHTML = col.units.map(u => `<option value="${u}">${u}</option>`).join("");

        const applyUnits = () => {
          col.scaleFactor = col.map[select.value] !== undefined ? col.map[select.value] : 1.0;
          dt.update();
        };

        wrap.addEventListener("click", e => e.stopPropagation());
        select.addEventListener("click", e => e.stopPropagation());
        select.addEventListener("change", applyUnits);
        wrap.appendChild(select);
        th.appendChild(wrap);
      }
    }
  };
</script>
