<!-- Asset dependencies -->
<link rel="stylesheet" href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_bootstrap5.min.css">
<script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

<!-- Custom styles -->
<style>

  /* Container & table layout */
  .tabulator-container-wrap { margin: 1.5rem 0; font-size: 0.9em; width: 100%; }
  .tabulator { border: 1px solid #dee2e6; background-color: transparent !important; width: 100% !important; }
  .tabulator-footer { background-color: transparent !important; border-top: 1px solid #dee2e6 !important; }

  /* Header & sorting alignment */
  .tabulator-col, .tabulator-col-content { overflow: visible !important; }
  .tabulator-header .tabulator-col-title-holder { align-items: flex-start !important; }
  .tabulator-header .tabulator-col-sorter { align-self: flex-start !important; margin-top: 2px !important; }
  .tabulator-title-wrap { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .tabulator-header-filter { margin-top: 4px !important; }

  /* Dropdown controls */
  .tabulator-header select,
  .tabulator-header-filter select,
  .tabulator-unified-select {
    display: block !important;
    width: 100% !important;
    font-size: 0.75rem !important;
    padding: 0.2rem 1.4rem 0.2rem 0.4rem !important;
    line-height: 1.2 !important;
    color: #212529 !important;
    background-color: #ffffff !important;
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23343a40' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") !important;
    background-repeat: no-repeat !important;
    background-position: right 0.35rem center !important;
    background-size: 9px 9px !important;
    border: 1px solid #ced4da !important;
    border-radius: 0.2rem !important;
    box-sizing: border-box !important;
    appearance: none !important;
    -webkit-appearance: none !important;
    -moz-appearance: none !important;
    cursor: pointer !important;
  }

  /* Focus states */
  .tabulator-header select:focus,
  .tabulator-header-filter select:focus,
  .tabulator-unified-select:focus {
    outline: none !important;
    border-color: #86b7fe !important;
    box-shadow: inset 0 0 0 1px #86b7fe !important;
  }

</style>

<script>

// LaTeX re-typesetting helper for tabulator-latex-col
function retriggerMath(container) {
  if (!container) return;

  const doTypeset = () => {
    const latexElements = Array.from(container.querySelectorAll(".tabulator-latex-col"));
    if (latexElements.length === 0) return;

    if (window.MathJax && typeof window.MathJax.typesetPromise === "function") {
      window.MathJax.typesetPromise(latexElements).catch(err => console.error("MathJax error:", err));
    } else if (typeof renderMathInElement === "function") {
      latexElements.forEach(el => {
        renderMathInElement(el, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      });
    }
  };

  if (window.MathJax && typeof window.MathJax.typesetPromise === "function") {
    doTypeset();
  } else if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
    window.MathJax.startup.promise.then(doTypeset);
  } else {
    let attempts = 0;
    const interval = setInterval(() => {
      attempts++;
      if ((window.MathJax && typeof window.MathJax.typesetPromise === "function") || typeof renderMathInElement === "function") {
        clearInterval(interval);
        doTypeset();
      } else if (attempts > 60) {
        clearInterval(interval);
      }
    }, 50);
  }
}

// Select dropdown component factory
function createSelectMenu(options, onChange, selectedValue = "") {
  const select = document.createElement("select");
  select.className = "form-select form-select-sm tabulator-unified-select";
  select.style.fontSize = "0.75rem";

  options.forEach(opt => {
    const optionEl = document.createElement("option");
    const val = typeof opt === "object" ? opt.value : opt;
    const lbl = typeof opt === "object" ? opt.label : opt;
    optionEl.value = val;
    optionEl.textContent = lbl;
    if (String(val) === String(selectedValue)) optionEl.selected = true;
    select.appendChild(optionEl);
  });

  select.addEventListener("click", e => e.stopPropagation());
  select.addEventListener("change", e => onChange(e.target.value));
  return select;
}

// Column feature registry
const ColumnFeatures = {

  // Numeric formatting & unit scaling
  number: (colDef, colCfg, ctx) => {
    colDef.formatter = (cell) => {
      const val = cell.getValue();
      if (val === null || val === undefined || val === "") return "";
      const num = Number(val);
      if (isNaN(num)) return String(val);

      const factor = ctx.unitFactors[colCfg.index] || 1;
      const converted = num * factor;
      const abs = Math.abs(converted);

      return (abs > 0 && (abs < 1e-3 || abs >= 1e4))
        ? converted.toExponential(2)
        : Number(converted.toFixed(4)).toString();
    };
  },

  // Scientific notation formatted into LaTeX math strings
  latexnum: (colDef, colCfg, ctx) => {
    ColumnFeatures.number(colDef, colCfg, ctx);
    const baseFormatter = colDef.formatter;
    colDef.formatter = (cell) => {
      const formattedVal = baseFormatter(cell);
      if (!formattedVal || isNaN(Number(cell.getValue()))) return formattedVal;
      if (formattedVal.includes("e")) {
        const [mantissa, exponent] = formattedVal.split("e");
        return `$${mantissa} \\times 10^{${parseInt(exponent, 10)}}$`;
      }
      return `$${formattedVal}$`;
    };
  },

  // Multi-value dropdown header filter
  dropdown: (colDef, colCfg, ctx) => {
    const field = "col_" + colCfg.index;
    const rawValues = [...new Set((ctx.rows || []).map(r => r[field]).filter(v => v !== null && v !== undefined && v !== ""))].sort();
    
    const options = [
      { label: "All", value: "" },
      ...rawValues.map(v => ({ label: v, value: v }))
    ];

    colDef.headerFilter = function(cell, onRendered, success, cancel, editorParams) {
      return createSelectMenu(options, (val) => success(val));
    };
  },

  // Dynamic unit conversion select menu
  units: (colDef, colCfg, ctx) => {
    if (!colCfg.units || !colCfg.map) return;
    
    ctx.unitFactors[colCfg.index] = colCfg.map[colCfg.units[0]] || 1;

    colDef.titleFormatter = () => {
      const wrap = document.createElement("div");
      wrap.className = "tabulator-title-wrap";

      const label = document.createElement("span");
      label.className = "fw-bold";
      label.textContent = colCfg.name || "";
      wrap.appendChild(label);

      const select = createSelectMenu(
        colCfg.units, 
        (val) => {
          const factor = colCfg.map[val];
          if (factor !== undefined) {
            ctx.unitFactors[colCfg.index] = factor;
            ctx.table.redraw(true);
          }
        }, 
        colCfg.units[0]
      );

      wrap.appendChild(select);
      return wrap;
    };
  }

};

// Table controller
class TabulatorTableController {

  constructor(container) {
    this.container = container;
    this.headers = JSON.parse(container.dataset.headers || "[]");
    this.rows = JSON.parse(container.dataset.rows || "[]");
    this.config = JSON.parse(container.dataset.columns || "[]");
    this.perPage = parseInt(container.dataset.perpage || "15", 10);
    this.searchable = container.dataset.searchable !== "false";
    this.sortable = container.dataset.sortable !== "false";
    
    this.unitFactors = {};
    this.table = null;
    this.init();
  }

  init() {
    this.container.innerHTML = "";
    
    const topBar = document.createElement("div");
    topBar.className = "d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2";
    if (this.searchable) {
      topBar.innerHTML = '<input type="text" class="form-control form-control-sm tabulator-search-input" style="width:220px;" placeholder="Search table...">';
    } else {
      topBar.innerHTML = '<div></div>';
    }

    const scrollWrap = document.createElement("div");
    scrollWrap.style.overflowX = "auto";
    scrollWrap.style.width = "100%";

    const tableDiv = document.createElement("div");
    tableDiv.style.width = "100%";
    scrollWrap.appendChild(tableDiv);

    this.container.appendChild(topBar);
    this.container.appendChild(scrollWrap);

    const columns = this.headers.map((h, idx) => {
      const colCfg = this.config.find(c => c.index === idx) || { index: idx };
      colCfg.name = colCfg.header || h;
      const isLatex = Boolean(colCfg.latex || colCfg.latexnum);

      const colDef = {
        title: colCfg.name,
        cssClass: isLatex ? "tabulator-latex-col" : "",
        field: "col_" + idx,
        headerSort: colCfg.sortable !== undefined ? colCfg.sortable : this.sortable,
        sorter: colCfg.type === "number" ? "number" : "string",
        sorterParams: { alignEmptyValues: "bottom" },
        headerHozAlign: "left",
        minWidth: (colCfg.dropdown || colCfg.units) ? 115 : 55
      };

      if (colCfg.type === "number" && !colCfg.latexnum) ColumnFeatures.number(colDef, colCfg, this);
      if (colCfg.latexnum) ColumnFeatures.latexnum(colDef, colCfg, this);
      if (colCfg.dropdown) ColumnFeatures.dropdown(colDef, colCfg, this);
      if (colCfg.units) ColumnFeatures.units(colDef, colCfg, this);

      return colDef;
    });

    this.table = new Tabulator(tableDiv, {
      data: this.rows,
      columns: columns,
      layout: "fitDataFill",
      responsiveLayout: false,
      pagination: "local",
      paginationSize: this.perPage,
      paginationSizeSelector: [10, 15, 25, 50],
      movableColumns: false
    });

    this.table.on("renderComplete", () => {
      retriggerMath(this.container);
    });

    if (this.searchable) {
      const searchInput = topBar.querySelector(".tabulator-search-input");
      if (searchInput) {
        searchInput.addEventListener("keyup", (e) => {
          const query = e.target.value.toLowerCase().trim();
          if (query === "") {
            this.table.clearFilter();
          } else {
            this.table.setFilter((data) => {
              return Object.values(data).some(val => String(val || "").toLowerCase().includes(query));
            });
          }
        });
      }
    }
  }

}

// Global initialization
function initDynamicTables() {
  document.querySelectorAll(".tabulator-container-wrap").forEach(el => {
    if (!el.dataset.initialized) {
      el.dataset.initialized = "true";
      new TabulatorTableController(el);
    }
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initDynamicTables);
} else {
  initDynamicTables();
}

</script>
