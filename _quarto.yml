website:
  title: "Scientific Table Template"
  search: true
  navbar:
    background: primary
    style: "docked"
    logo: "img/logo/logo.png"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Topics"
        menu:
        - text: "Examples"
          menu:
          - auto: "doc/Examples/*.qmd"
        - text: "Physics"
          menu:
          - auto: "doc/Physics/*.qmd"
      - text: "GitHub Project"
        href: https://github.com/MKReyesH/ScientificTable
      - text: "About"
        href: about.qmd

bibliography: bib/references.bib
csl: bib/journal-of-cosmology-and-astroparticle-physics.csl

project:
  type: website

filters:
  - lua/latex-to-quarto.lua
  - lua/mindmap-graph.lua

format:
  html:
    theme: cosmo
    math: mathjax
    css: include/css-config.css
    