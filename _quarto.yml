project:
  type: website

website:
  title: "Scientific Wiki Template"
  search: true
  sidebar:
    style: docked
    logo: 
      light: img/logo/logo_black.png
      dark: img/logo/logo_white.png
    contents:
      - href: index.qmd
        text: "Home"
      - section: "Topics"
        contents:
        - section: "Examples"
          contents:
          - auto: "doc/Examples/*.qmd"
      - href: https://github.com/MKReyesH/ScientificTable
        text: "GitHub Project"
      - href: about.qmd
