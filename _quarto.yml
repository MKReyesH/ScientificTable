  navbar:
    logo:
      light: img/logo/logo_black.png
      dark: img/logo/logo_white.png
    left:
      - text: "Home"
        href: index.qmd
      - text: "Topics"
        menu:
          - text: "Examples"
          - href: doc/Examples/example1.qmd
          - href: doc/Examples/example2.qmd
          - href: doc/Examples/example3.qmd
          - href: doc/Examples/example4.qmd
          - href: doc/Examples/example5.qmd
    right:
      - icon: github
        aria-label: "GitHub Project"
        href: https://github.com/MKReyesH/ScientificTable
      - href: about.qmd

format:
  html:
    math: mathjax
    css: include/theme-config.css
    respect-user-color-scheme: true
    theme: # Options: cosmo, minty, flatly, darkly, slate, lux, etc.
      light: minty
      dark: [minty, include/theme-dark-patch.scss]

bibliography: bib/references.bib
csl: bib/jcap.csl

filters: # To remove the feature comment its line
  - include/theme-toggle/theme-toggle.lua
  - include/latex-to-quarto/latex-to-quarto.lua
  - include/dynamic-tables/dynamic-tables.lua
  - include/dynamic-plots/dynamic-plots.lua
  - include/dynamic-mindmaps/dynamic-mindmaps.lua