project:
  type: website

website:
  search: true
  navbar:
    background: primary
    logo:
      light: img/logo/logo_black.png
      dark: img/logo/logo_white.png
    left:
      - text: "Home"
        href: index.qmd
      - text: "Tables"
        href: "doc/tables.qmd"
      - text: "Plots"
        href: "doc/plots.qmd"
      - text: "Mindmaps"
        href: "doc/mindmaps.qmd"
      - text: "GitHub Project"
        href: https://github.com/MKReyesH/ScientificTable
      - text: "About"
        href: about.qmd

format:
  html:
    math: mathjax
    css: include/css-config.css
    respect-user-color-scheme: true
    theme: # Options: cosmo, minty, flatly, darkly, slate, lux, etc.
      light: flatly
      dark: [flatly, include/dark-theme/dark-theme.scss]
    include-after-body:
      - include/dark-theme/dark-theme-toggle.html

bibliography: bib/references.bib
csl: bib/jcap.csl

filters: # The order matters
  - include/latex-to-quarto/latex-to-quarto.lua
  - include/dynamic-tables/dynamic-tables.lua
  - include/dynamic-plots/dynamic-plots.lua
  - include/dynamic-mindmaps/dynamic-mindmaps.lua