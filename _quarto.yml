website:
  search: true
  navbar:
    background: primary
    logo: "img/logo/logo.png"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Bounds"
        href: "doc/bounds.qmd"
      - text: "Processes"
        href: "doc/processes.qmd"
      - text: "Backgrounds"
        href: "doc/backgrounds.qmd"
      - text: "GitHub Project"
        href: https://github.com/MKReyesH/ScientificTable
      - text: "About"
        href: about.qmd

bibliography: bib/global.bib
csl: bib/jcap.csl

project:
  type: website

filters:
  - lua/latex-to-quarto.lua
  - lua/dynamic-tables.lua
  - lua/mindmap-graph.lua

format:
  html:
    theme: # Options: cosmo, minty, flatly, darkly, slate, lux, etc.
      respect-user-color-scheme: true
    	light: minty
    	dark: [minty, include/dark-theme.css]
    math: mathjax
    css: include/css-config.css
    